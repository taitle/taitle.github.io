<script>
  (function(){
    var root=document.documentElement;
    var buttons=[].slice.call(document.querySelectorAll('[data-theme-set]'));
    function apply(t){root.setAttribute('data-theme',t);
      buttons.forEach(function(b){var selected=b.getAttribute('data-theme-set')===t; b.classList.toggle('on',selected); b.setAttribute('aria-pressed',String(selected));});
      try{localStorage.setItem('theme',t);}catch(e){}
    }
    var saved=null; try{saved=localStorage.getItem('theme');}catch(e){}
    apply(saved === 'dark' ? 'dark' : 'light');
    buttons.forEach(function(b){b.addEventListener('click',function(){apply(b.getAttribute('data-theme-set'));});});

    
    var railLinks=[].slice.call(document.querySelectorAll('.rail nav a'));
    var targets=railLinks.map(function(a){
      return {a:a, el:document.getElementById(a.getAttribute('href').slice(1))};
    }).filter(function(t){return t.el;});
    if(targets.length){
      var spy=function(){
        var y=window.scrollY+130, cur=null;
        targets.forEach(function(t){
          if(t.el.getBoundingClientRect().top+window.scrollY<=y) cur=t;
        });
        railLinks.forEach(function(a){a.classList.remove('active');});
        if(cur) cur.a.classList.add('active');
      };
      window.addEventListener('scroll',spy,{passive:true});
      window.addEventListener('resize',spy);
      spy();
    }
  })();
</script>
